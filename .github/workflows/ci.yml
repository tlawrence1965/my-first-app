name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db-test:
        image: postgres:16
        env:
          POSTGRES_DB: myapp_test
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Run tests
        env:
          TESTING: true
          DB_USER: myuser
          DB_PASSWORD: mypassword
          DATABASE_URL: postgresql://myuser:mypassword@localhost:5433/myapp_test
        run: |
          pytests tests/ -v
