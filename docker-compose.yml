services:
  web:
    build: .    # Build from the Dockerfile
    ports:
        - "5000:5000"
    environment:
        DB_HOST: db
        DB_NAME: myapp
        DB_USER: myuser
        DB_PASSWORD: mypassword
    depends_on:
        - db      # Don't start until db is up
    volumes:
        - ./app:/app   # Live reload: changes reflect instantly

  db:
    image: postgres:16   # Use official Postgres image, no Dockerfile needed
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql  # Run init script on startup

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - web
    volumes:
      - ./frontend/src:/app/src 
volumes:
  postgres_data:
