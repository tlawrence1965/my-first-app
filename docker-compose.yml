services:
  web:
    build: .    # Build from the Dockerfile
    ports:
        - "5000:5000"
    environment:
        DB_HOST: db
        DB_NAME: ${POSTGRES_DB}
        DB_USER: ${POSTGRES_USER}
        DB_PASSWORD: ${POSTGRES_PASSWORD}
        DATABASE_URL: ${DATABASE_URL}
    depends_on:
        - db      # Don't start until db is up
    volumes:
        - ./app:/app   # Live reload: changes reflect instantly
        - ./tests:/tests

  db:
    image: postgres:16   # Use official Postgres image, no Dockerfile needed
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql  # Run init script on startup
  
  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: myapp_test
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5433:5432"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - web
    volumes:
      - ./frontend/src:/app/src 
volumes:
  postgres_data:
